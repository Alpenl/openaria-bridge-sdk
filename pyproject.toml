[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ylx-card-pipeline"
version = "0.1.0"
description = "Open Aria Bridge SDK and CLI for verified recording import and publication"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.64",
    "cryptography>=50.0.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "jsonschema[format]>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "/main.py",
    "/provenance.py",
    "/pyproject.toml",
    "/README.md",
    "/vendor",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "provenance.py",
    "vendor",
]
