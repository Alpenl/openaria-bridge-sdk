[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ylx-card-pipeline"
version = "0.4.0"
description = "Open Aria Bridge SDK and CLI for verified recording import and publication"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.64",
    "cryptography>=50.0.0",
    "imageio-ffmpeg>=0.6.0,<1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "jsonschema[format]>=4.23,<5",
    "textual>=8.2.8,<9",
    "zeroconf>=0.151.2,<1",
]

[project.scripts]
openaria-bridge = "openaria.bridge.sdk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "/main.py",
    "/provenance.py",
    "/openaria",
    "/pyproject.toml",
    "/README.md",
    "/vendor",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "provenance.py",
    "openaria",
    "vendor",
]
