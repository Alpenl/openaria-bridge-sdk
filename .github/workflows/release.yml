name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify release tag
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Run tests
        run: uv run pytest -q
      - name: Build distributions
        run: |
          uv build
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --format requirements-txt --output-file dist/constraints.txt
          cp install.sh dist/install.sh
          sh -n dist/install.sh
      - name: Prepare checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum install.sh constraints.txt *.whl *.tar.gz > SHA256SUMS
      - name: Smoke test release installer
        env:
          OPENARIA_BRIDGE_ALLOW_FILE_URLS: "1"
          OPENARIA_BRIDGE_RELEASE_ROOT: file://${{ github.workspace }}/dist
          OPENARIA_BRIDGE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          OPENARIA_BRIDGE_BIN_DIR: ${{ runner.temp }}/openaria-bin
          UV_TOOL_DIR: ${{ runner.temp }}/openaria-tools
          UV_NO_PROGRESS: "1"
        run: |
          sh dist/install.sh
          test "$("${OPENARIA_BRIDGE_BIN_DIR}/openaria-bridge" --version)" = \
            "openaria-bridge ${GITHUB_REF_NAME#v}"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/install.sh \
            dist/constraints.txt \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Open Aria Bridge ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --latest
