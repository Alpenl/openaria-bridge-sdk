name: Desktop Exporter

on:
  push:
    branches: [main]
    tags: ['exporter-v*']
    paths:
      - 'desktop/exporter/**'
      - '.github/workflows/exporter.yml'
  pull_request:
    paths:
      - 'desktop/exporter/**'
      - '.github/workflows/exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exporter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            target: darwin/arm64
            media_flag: --macos-media-dir
          - os: windows-2025
            platform: windows-amd64
            target: windows/amd64
            media_flag: --windows-media-dir
          - os: ubuntu-22.04
            platform: linux-amd64
            target: linux/amd64
            media_flag: --linux-media-dir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop/exporter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/exporter/go.mod
          cache-dependency-path: desktop/exporter/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config e2fsprogs xvfb
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Verify version and release namespace
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -c 'import json,os; v=json.load(open("mygo.json"))["version"]; assert os.environ["REF_TYPE"] != "tag" or os.environ["REF_NAME"] == "exporter-v"+v; print("Desktop Exporter",v)'
      - name: Prepare complete media runtime
        run: |
          python scripts/prepare_media.py --platform '${{ matrix.platform }}' --out build/media
          python -c 'import os,pathlib; p=str(pathlib.Path("build/media").resolve()); open(os.environ["GITHUB_PATH"],"a").write(p+"\n"); open(os.environ["GITHUB_ENV"],"a").write("OPENARIA_FFMPEG_DIR="+p+"\n")'
      - name: Verify Go formatting
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Run native Go tests and vet
        run: |
          go test -count=1 -timeout=10m ./...
          go vet ./...
      - name: Stress Windows history concurrency
        if: runner.os == 'Windows'
        run: go test -count=5 -run TestConcurrentClientsAndCorruptStore -timeout=3m ./internal/history
      - name: Check data races
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=10m ./...
      - name: Test packaging
        run: |
          python -m unittest discover -s scripts -p 'test_package.py'
          python -m unittest discover -s scripts -p 'test_media.py'
      - name: Test macOS installer permissions
        if: runner.os == 'macOS'
        run: python -m unittest discover -s scripts -p 'test_permissions.py'
      - name: Build full installer
        run: python scripts/package.py --platform '${{ matrix.target }}' '${{ matrix.media_flag }}' build/media --skip-dmg
      - name: Verify packaged runtime and stage installers
        run: python scripts/verify_runtime.py --platform '${{ matrix.platform }}'
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exporter-${{ matrix.platform }}-${{ github.sha }}
          path: desktop/exporter/build/deliverables/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Prepare desktop release draft
    if: startsWith(github.ref, 'refs/tags/exporter-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: exporter-*-${{ github.sha }}
          path: packages
      - name: Verify all assets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess
          root=pathlib.Path('packages'); output=pathlib.Path('release'); output.mkdir()
          sums=[]
          for platform in ('darwin-arm64','windows-amd64','linux-amd64'):
              folder=root/('exporter-'+platform+'-'+os.environ['GITHUB_SHA'])
              for line in (folder/'SHA256SUMS').read_text().splitlines():
                  digest,name=line.split('  ',1)
                  assert pathlib.Path(name).name==name
                  src=folder/name
                  with src.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==digest
                  assert not (output/name).exists()
                  shutil.copy2(src,output/name); sums.append(line+'\n')
              shutil.copy2(folder/'BUILD-INFO.json',output/('BUILD-INFO-'+platform+'.json'))
          (output/'SHA256SUMS').write_text(''.join(sorted(sums)))
          notes='Complete desktop installers with bundled FFmpeg/ffprobe. macOS uses ad-hoc signing (not notarized); Windows is unsigned. Source-card deletion and automatic updates are not enabled. Verify SHA256SUMS before installation. This desktop release does not replace the Python SDK latest release.'
          subprocess.run(['gh','release','create',os.environ['RELEASE_TAG'],'--verify-tag','--draft','--latest=false','--title','Open Aria Exporter '+os.environ['RELEASE_TAG'],'--notes',notes,*map(str,sorted(output.iterdir()))],check=True)
          PY
